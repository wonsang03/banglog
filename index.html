    <h1 class="intro-title">입주 날 찍은 사진이<br>퇴실 날 근거가 되도록.</h1>
    <p class="intro-desc">입주 날 방 전체를 한 번 찍으면 찍기 좋은 자리에 핀을 꽂아 주고, 1년 뒤와 퇴실 날에도 같은 핀에서 같은 구도로 다시 찍어 비교하는 자취방 기록 서비스 프로토타입입니다.</p>
    <nav class="intro-nav" id="introNav">
      <button data-j="onboard"><b>사용법 보기</b><span>처음 켰을 때 나오는 안내 4단계</span></button>
      <button data-j="fresh"><b>입주 촬영 처음부터</b><span>방 전체 찍기, 핀 10곳 기준 사진, 보관까지</span></button>
      <button data-j="records"><b>1년 뒤 퇴실 상황</b><span>같은 핀에서 찍은 입주·퇴실 사진 비교</span></button>
      <button data-j="export"><b>확인서 미리보기</b><span>촬영 일시와 보관 번호가 담긴 문서</span></button>
    </nav>
    <p class="intro-foot">휴먼컴퓨터인터페이스 · 서상원 223613<br>방 구조 파악·도면 생성과 공인전자문서센터 보관은 구현을 가정한 모의 기능이며, 보관 번호는 예시 값입니다.</p>
  </aside>
